# Rover Pay (rovershop-storefront#173): build the Stripe app's container image
# and push it to GHCR. Deploying it to Azure Container Apps is a separate step
# for now - this repo has no Azure OIDC federated credential yet.
name: Rover Pay image

on:
  push:
    branches: [rover]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/danprivera/rover-pay

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/stripe/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
